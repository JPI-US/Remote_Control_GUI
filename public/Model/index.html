<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic HTML metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tower Control</title>
    
    <!-- Styles for the application UI -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        
        #controls h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        #controls p {
            margin: 5px 0;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
        }
        
        /* Styling for keyboard key indicators in the controls panel */
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Main application container -->
    <div id="container">
        <!-- Loading message (hidden after model loads) -->
        <div id="loading">Loading 3D Model...</div>
        
        <!-- Container for Three.js canvas (rendered by app.js) -->
        <div id="canvas-container"></div>
        
        <!-- Control instructions panel -->
        <div id="controls">
            <h2>Controls</h2>
            <p><span class="key">←</span> Left Arrow: Rotate Left</p>
            <p><span class="key">→</span> Right Arrow: Rotate Right</p>
            <p><span class="key">Space</span> Toggle Auto Sun Tracking</p>
            <p>Mouse: Drag to rotate camera</p>
            <p>Wheel: Zoom in/out</p>
            <p style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.2);">
                <strong>Sun Tracking:</strong> Tower automatically follows the sun
            </p>
        </div>
    </div>
    
    <!-- Import map for ES6 module imports (Three.js from CDN) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- Main application script -->
    <script type="module" src="app.js"></script>
</body>
</html>
