name: Build & Deploy to EC2

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image to ECR
        run: |
          docker build \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg SOLAR_KEY_ID="${{ secrets.SOLAR_KEY_ID }}" \
            --build-arg SOLAR_KEY_VALUE="${{ secrets.SOLAR_KEY_VALUE }}" \
            --build-arg JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --build-arg FRONIUS_SYSTEM_KEY="${{ secrets.FRONIUS_SYSTEM_KEY }}" \
            -t ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ECR_REPOSITORY }}:latest \
            .
          docker push ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            # Authenticate Docker with ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}

            # Pull the new image
            docker pull ${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG

            # Stop and remove old container
            docker stop nextjs-app || true
            docker rm nextjs-app || true

            # Run new container
            docker run -d \
              --name nextjs-app \
              --restart unless-stopped \
              --env-file /home/ec2-user/.env.production \
              -p 80:3000 \
              ${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG

            # Clean up old images
            docker image prune -f